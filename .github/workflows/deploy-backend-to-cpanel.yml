name: Deploy CHMSU Grading Portal Backend to Staging

# Triggers the workflow on push to the staging branch
on:
  push:
    branches:
      - staging

# Allow only one deployment at a time
concurrency:
    group: staging-chmsu-grading-portal-backend-deploy
    cancel-in-progress: true

# This workflow deploys the backend API to the staging environment and restarts the PM2 process.
jobs:
  deploy-backend:
    name: ⚙️ Deploy CHMSU Grading Portal Backend & Restart PM2
    runs-on: ubuntu-latest
    
    # Steps to deploy the backend API
    steps:
      # Step 1: Get the latest code from the staging branch
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # Step 2: (Optional) If you are using Node.js, add your build steps here:
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Step 3: (Optional) If you have a build step for your backend, add it here:
      - name: 📂 Copy files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }} # Your server's IP or hostname
          username: ${{ secrets.SSH_USERNAME }} # Your SSH username
          key: ${{ secrets.SSH_PRIVATE_KEY }} # Your SSH private key stored in GitHub Secrets
          # Make sure this port matches your server's SSH port (default is 22)
          port: ${{ secrets.SSH_PORT }}
          # Deploying to a separate API folder, NOT the public web root
          source: ".,!.git/,!.github/,!node_modules/,!.env,!package-lock.json" # Exclude unnecessary files
          # Deploying to a separate API folder, NOT the public web root
          target: "/home/${{ secrets.SSH_USERNAME }}/public_html/subdomains/staging-grading-portal-api"

      # Step 4: Create .env file on server before npm install
      - name: 🔐 Create .env file
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cat > /home/${{ secrets.SSH_USERNAME }}/public_html/subdomains/staging-grading-portal-api/.env << 'EOF'
            # Environment variables configuration for CHMSU Grading Portal API
            # This file is generated by the GitHub Actions workflow during deployment.

            # Base URL of the frontend — used in email links, QR code generation, and CSP headers.
            NODE_ENV=staging

            # ---------------------------------------------------------------------------
            # CORS / Allowed Origins
            # ---------------------------------------------------------------------------
            ALLOWED_ORIGINS=${{ secrets.STAGING_ALLOWED_ORIGINS }}
            FRONT_URLS=${{ secrets.STAGING_ALLOWED_ORIGINS }}

            # ---------------------------------------------------------------------------
            # Database configuration
            # ---------------------------------------------------------------------------

            # Per-campus credentials.
            # For each campus, you can override HOST, NAME, USER, and/or PASSWORD.
            # Any value left empty falls back to the shared credentials above.

            # Staging
            DB_HOST=${{ secrets.STAGING_DB_HOST }}
            DB_NAME=${{ secrets.STAGING_DB_NAME }}
            DB_USER=${{ secrets.STAGING_DB_USER }}
            DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}

            # JWT and Google reCAPTCHA configuration
            JWT_SECRET_KEY=${{ secrets.STAGING_JWT_SECRET_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

            EOF

      # Step 5: (Optional) If you have a build step for your backend, add it here:
      - name: 🔄 Execute Server Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/${{ secrets.SSH_USERNAME }}/public_html/subdomains/staging-grading-portal-api
            npm install
            if pm2 describe staging-grading-portal-api > /dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --env staging --update-env
            else
              pm2 start ecosystem.config.cjs --env staging
            fi
            # ALWAYS save the state after a successful change
            pm2 save

      # Step 6: (Optional) Add a health check to ensure the API is running after deployment
      - name: ✅ Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            pm2 status staging-grading-portal-api
            curl -f https://staging-grading-portal-api.chmsu.edu.ph/health || exit 1